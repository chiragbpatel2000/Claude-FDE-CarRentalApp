# Render Blueprint: one web service serving the API and the built frontend.
services:
  - type: web
    name: driveeasy-car-rental
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false   # you paste your Neon connection string in the Render dashboard
